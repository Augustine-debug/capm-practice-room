<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAPM Practice Room</title>
<meta name="description" content="Free CAPM practice exams, custom practice and review, following the CAPM ECO 2023.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<!-- Theme chosen on the site (System / Light / Dark), applied before the page draws -->
<script>try{var t=JSON.parse(localStorage.getItem("cpr.theme"));if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<!-- GoatCounter: privacy-friendly visit counts, no cookies. Pages are counted from js/app.js (no_onload),
     because the app changes pages with #/ links that the default script would count as one page. -->
<script data-goatcounter="https://duyduy.goatcounter.com/count" data-goatcounter-settings='{"no_onload":true}' async src="https://gc.zgo.at/count.js"></script>
<script src="js/app.js" defer></script>
</head>
<body>
<main class="wrap" id="app"></main>
<noscript><p>CAPM Practice Room needs JavaScript to run.</p></noscript>
</body>
</html>
