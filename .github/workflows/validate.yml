name: Validate question bank

on:
  pull_request:
    paths: ["data/questions.json", "data/questions.csv", "scripts/validate.js", "scripts/export-csv.js"]
  push:
    branches: [main]
    paths: ["data/questions.json", "data/questions.csv", "scripts/validate.js", "scripts/export-csv.js"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.js
